


services:
  db:
    image: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bookDatabase
      MYSQL_ROOT_PASSWORD: springCRUD
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  spring-service:
    build: ./SpringCRUD
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: springCRUD
    ports:
      - "8082:8080"
    depends_on:
      - db
    restart: on-failure

  angular-service:
    build: ./AngularCRUD
    ports:
      - "4200:80"
    expose:
      - "4200"
    restart: unless-stopped

volumes:
  mysql_data:
    external: true
    name: d4111a5bb0db8b990a8babc5e34f65fc4b50fdb97c21c55f26d54f2e5ec88e76
